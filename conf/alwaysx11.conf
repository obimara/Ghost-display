# /etc/alwaysx11/alwaysx11.conf
# AlwaysX11 runtime configuration
# ─────────────────────────────────────────────────────────────────────────────
# After editing, restart the watcher:
#   sudo systemctl restart hdmi-watch.service

# ── HDMI detection ────────────────────────────────────────────────────────────
# How often to poll the DRM sysfs (seconds).
POLL_INTERVAL=1

# How many consecutive stable polls before acting (anti-flap threshold).
# At POLL_INTERVAL=1, STABLE_SECONDS=5 means 5 seconds of stable state needed.
STABLE_SECONDS=5

# Override the DRM sysfs root (for testing — leave blank for production).
#DRM_ROOT=/sys/class/drm

# ── Display manager ───────────────────────────────────────────────────────────
# Override auto-detected display manager. Leave blank for auto-detection.
# Valid values: gdm, gdm3, sddm, lightdm, lxdm, xdm, slim, nodm
#DM_SERVICE=

# ── Dummy Xorg display ────────────────────────────────────────────────────────
# Which virtual X display to use for the headless dummy session.
DUMMY_DISPLAY=:1

# Xorg config file for the dummy session.
DUMMY_XORG_CONF=/etc/alwaysx11/xorg-dummy.conf

# ── Headless remote access ────────────────────────────────────────────────────
# Start x11vnc automatically when switching to dummy (headless) mode.
# Requires: apt install x11vnc
# Set to "true" to enable.
VNC_ENABLE=false

# VNC port (default 5900)
VNC_PORT=5900

# VNC password file. Create with: x11vnc -storepasswd /etc/alwaysx11/vncpasswd
# Leave blank for no password (NOT recommended on networked systems).
VNC_PASSWD_FILE=/etc/alwaysx11/vncpasswd

# ── Logging ───────────────────────────────────────────────────────────────────
# Log level: debug | info | warn | error
LOG_LEVEL=info

# Log to file in addition to journald. Leave blank to disable file logging.
# LOG_FILE=/var/log/alwaysx11.log
