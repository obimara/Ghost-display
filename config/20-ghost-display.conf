# X11 dummy display for RustDesk/headless use.
# Install xserver-xorg-video-dummy, then start Xorg with:
#   Xorg :20 -config /etc/X11/ghost-display.conf -noreset +extension RANDR
#
# The script controls the final logical monitor layout with xrandr.
# This file only provides a generous dummy framebuffer and common modes.

Section "Device"
    Identifier  "GhostDummyDevice"
    Driver      "dummy"
    # 512 MiB is enough for large multi-monitor dummy framebuffers.
    VideoRam    524288
EndSection

Section "Monitor"
    Identifier  "GhostMonitor"
    HorizSync   15.0-240.0
    VertRefresh 30.0-240.0

    Modeline "1280x720_60.00"   74.50 1280 1344 1472 1664  720  723  728  748 -hsync +vsync
    Modeline "1600x900_60.00"  118.25 1600 1696 1856 2112  900  903  908  934 -hsync +vsync
    Modeline "1920x1080_60.00" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
    Modeline "2560x1440_60.00" 312.25 2560 2752 3024 3488 1440 1443 1448 1493 -hsync +vsync
    Modeline "3840x2160_30.00" 338.75 3840 4080 4488 5136 2160 2163 2168 2200 -hsync +vsync
EndSection

Section "Screen"
    Identifier  "GhostScreen"
    Device      "GhostDummyDevice"
    Monitor     "GhostMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080_60.00" "1280x720_60.00" "1600x900_60.00" "2560x1440_60.00" "3840x2160_30.00"
        # Maximum canvas. The runtime script chooses the active framebuffer.
        # Examples supported within this limit: 2x4K horizontal, 4x1080p horizontal,
        # vertical stacks, and scaled RustDesk workspaces.
        Virtual 8192 8192
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "GhostLayout"
    Screen     "GhostScreen"
EndSection
