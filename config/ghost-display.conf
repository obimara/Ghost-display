# /etc/ghost-display/ghost-display.conf
# Ghost Display v2 - Unified Configuration
# 
# After editing, restart the service:
#   sudo systemctl restart ghost-display.service
#
# =============================================================================
# MODE SETTINGS
# =============================================================================
# Mode of operation:
#   virtual   - Pure virtual display only (for RustDesk, no HDMI monitoring)
#   hotplug   - HDMI hotplug monitoring only (like AlwaysX11)
#   combined  - Both virtual display + HDMI monitoring (recommended)
MODE=combined

# =============================================================================
# VIRTUAL DISPLAY SETTINGS
# (Used in 'virtual' and 'combined' modes)
# =============================================================================

# Display number for the virtual X11 display
VIRTUAL_DISPLAY_NUM=20

# Number of virtual monitors to create
VIRTUAL_MONITORS=2

# Default resolution for virtual monitors (WIDTHxHEIGHT)
VIRTUAL_RESOLUTION=1920x1080

# Scaling factor for virtual monitors
VIRTUAL_SCALE=1.0

# DPI for virtual display
VIRTUAL_DPI=96

# Monitor layout: horizontal or vertical
VIRTUAL_LAYOUT=horizontal

# Prefix for monitor names (e.g., "Ghost-1", "Ghost-2")
VIRTUAL_NAME_PREFIX=Ghost

# Custom monitor specifications (overrides VIRTUAL_MONITORS and VIRTUAL_RESOLUTION)
# Format: "WIDTHxHEIGHT@SCALE,WIDTHxHEIGHT@SCALE,..."
# Example: VIRTUAL_MONITOR_SPECS=1920x1080@1,2560x1440@1.25
# Leave blank to use VIRTUAL_MONITORS and VIRTUAL_RESOLUTION
VIRTUAL_MONITOR_SPECS=

# Maximum framebuffer size (prevents Xorg from failing with large setups)
VIRTUAL_MAX_WIDTH=8192
VIRTUAL_MAX_HEIGHT=8192

# =============================================================================
# HDMI HOTPLUG SETTINGS
# (Used in 'hotplug' and 'combined' modes)
# =============================================================================

# How often to poll HDMI status (seconds)
HDMI_POLL_INTERVAL=1

# How many consecutive stable polls before acting (anti-flap threshold)
# At HDMI_POLL_INTERVAL=1, HDMI_STABLE_SECONDS=5 means 5 seconds of stable state needed
HDMI_STABLE_SECONDS=5

# DRM sysfs root path (for testing, leave blank for production)
# HDMI_DRM_ROOT=/sys/class/drm

# =============================================================================
# DISPLAY MANAGER SETTINGS
# =============================================================================

# Override auto-detected display manager
# Valid values: gdm, gdm3, sddm, lightdm, lxdm, xdm, slim, nodm
# Leave blank for auto-detection
DM_SERVICE=

# =============================================================================
# XORG SETTINGS
# =============================================================================

# Path to Xorg binary
# XORG_BIN=/usr/bin/Xorg

# Xorg configuration file for dummy/headless mode
DUMMY_XORG_CONF=/etc/ghost-display/xorg-dummy.conf

# Directory for Xorg log files
XORG_LOG_DIR=/var/log/ghost-display

# =============================================================================
# VNC SETTINGS (Optional)
# =============================================================================

# Enable x11vnc in headless mode
VNC_ENABLE=false

# VNC port (default 5900)
VNC_PORT=5900

# VNC password file. Create with: x11vnc -storepasswd /etc/ghost-display/vncpasswd
# Leave blank for no password (NOT recommended on networked systems)
VNC_PASSWD_FILE=/etc/ghost-display/vncpasswd

# =============================================================================
# RUNTIME SETTINGS
# =============================================================================

# Runtime directory for PID files, locks, and state
RUN_DIR=/run/ghost-display

# Configuration file path (this file)
CONF_FILE=/etc/ghost-display/ghost-display.conf

# =============================================================================
# LOGGING SETTINGS
# =============================================================================

# Log level: debug | info | warn | error
LOG_LEVEL=info

# Log to file in addition to journald. Leave blank to disable file logging.
# LOG_FILE=/var/log/ghost-display.log

# =============================================================================
# TIMEOUT SETTINGS
# =============================================================================

# Seconds to wait for DM start/stop
WAIT_TIMEOUT_S=15

# =============================================================================
# RUSTDESK OPTIMIZATION
# =============================================================================

# Optimize settings for RustDesk
RUSTDESK_OPTIMIZED=true
