Section "Device"
    Identifier "DummyDevice"
    Driver     "dummy"
    VideoRam   16384
EndSection
Section "Monitor"
    Identifier "DummyMonitor"
    HorizSync  28-80
    VertRefresh 48-75
EndSection
Section "Screen"
    Identifier "DummyScreen"
    Device     "DummyDevice"
    Monitor    "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Virtual 1920 1080
    EndSubSection
EndSection
